apiVersion: v1
kind: Pod
metadata:
  name: pod-secure-nginx
  namespace: audit-zone
  labels:
    app: secure-test
    security-compliant: "true"
spec:
  # ServiceAccount с минимальными правами
  serviceAccountName: audit-test-sa
  
  # Отключить автомонтирование service account токена (если не нужен)
  automountServiceAccountToken: false
  
  securityContext:
    # Pod-level security context
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
    seccompProfile:
      type: RuntimeDefault
  
  containers:
  - name: nginx
    image: nginx:1.25-alpine
    
    securityContext:
      # Container-level security context
      # ✅ НЕ privileged
      privileged: false
      
      # ✅ Запрет эскалации привилегий
      allowPrivilegeEscalation: false
      
      # ✅ Запуск от non-root пользователя
      runAsNonRoot: true
      runAsUser: 1000
      
      # ✅ Read-only root filesystem
      readOnlyRootFilesystem: true
      
      # Минимальные capabilities (или без них)
      capabilities:
        drop:
          - ALL
    
    ports:
    - containerPort: 8080  # nginx может слушать на непривилегированном порту
    
    # Для работы nginx с readOnlyRootFilesystem нужны volume для временных файлов
    volumeMounts:
    - name: cache
      mountPath: /var/cache/nginx
    - name: run
      mountPath: /var/run
  
  volumes:
  - name: cache
    emptyDir: {}
  - name: run
    emptyDir: {}

