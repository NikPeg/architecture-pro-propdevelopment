apiVersion: v1
kind: Pod
metadata:
  name: pod-secure-busybox
  namespace: audit-zone
  labels:
    app: secure-test
    security-compliant: "true"
spec:
  serviceAccountName: audit-test-sa
  automountServiceAccountToken: false
  
  securityContext:
    # ✅ Обязательно runAsNonRoot на pod level
    runAsNonRoot: true
    runAsUser: 2000
    runAsGroup: 3000
    fsGroup: 2000
    
    # Seccomp profile для ограничения syscalls
    seccompProfile:
      type: RuntimeDefault
  
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sleep", "3600"]
    
    securityContext:
      # ✅ НЕ root пользователь (UID > 0)
      runAsNonRoot: true
      runAsUser: 2000
      runAsGroup: 3000
      
      # ✅ Запрет привилегий
      privileged: false
      allowPrivilegeEscalation: false
      
      # ✅ Read-only root filesystem
      readOnlyRootFilesystem: true
      
      # ✅ Минимальные capabilities
      capabilities:
        drop:
          - ALL
        # Если нужны специфичные capabilities, добавлять явно:
        # add:
        #   - NET_BIND_SERVICE  # для bind на порты < 1024
    
    # Volume для временных файлов (так как rootFS read-only)
    volumeMounts:
    - name: tmp
      mountPath: /tmp
  
  volumes:
  - name: tmp
    emptyDir: {}

---
# Дополнительный пример: Deployment с теми же security настройками
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-deployment
  namespace: audit-zone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-app
  template:
    metadata:
      labels:
        app: secure-app
        security-compliant: "true"
    spec:
      serviceAccountName: audit-test-sa
      automountServiceAccountToken: false
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 3000
        runAsGroup: 3000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      
      containers:
      - name: app
        image: alpine:3.19
        command: ["sleep", "infinity"]
        
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 3000
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        
        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
        
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      
      volumes:
      - name: tmp
        emptyDir: {}

