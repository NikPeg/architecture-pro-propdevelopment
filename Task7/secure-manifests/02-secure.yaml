apiVersion: v1
kind: Pod
metadata:
  name: pod-secure-alpine
  namespace: audit-zone
  labels:
    app: secure-test
    security-compliant: "true"
spec:
  serviceAccountName: audit-test-sa
  automountServiceAccountToken: false
  
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 3000
    fsGroup: 2000
    seccompProfile:
      type: RuntimeDefault
  
  containers:
  - name: alpine
    image: alpine:3.19
    command: ["sleep", "3600"]
    
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1001
      readOnlyRootFilesystem: true
      
      capabilities:
        drop:
          - ALL
    
    # ✅ Вместо hostPath используем безопасные volume типы
    volumeMounts:
    - name: data
      mountPath: /data
    - name: tmp
      mountPath: /tmp
  
  volumes:
  # ✅ emptyDir - безопасная альтернатива hostPath
  # Создается при создании пода, удаляется при удалении
  # Изолирована от хост-системы
  - name: data
    emptyDir: {}
  - name: tmp
    emptyDir: {}
  
  # Альтернативные безопасные volume типы:
  # - configMap - для конфигурационных файлов
  # - secret - для чувствительных данных
  # - persistentVolumeClaim - для персистентного хранилища
  # - projected - комбинация нескольких источников

