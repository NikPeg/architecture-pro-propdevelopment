apiVersion: v1
kind: Pod
metadata:
  name: pod-root-user
  namespace: audit-zone
  labels:
    app: insecure-test
    violation: root-user
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sleep", "3600"]
    securityContext:
      # НАРУШЕНИЕ 3: Запуск от root пользователя (UID 0)
      # Если контейнер будет скомпрометирован, атакующий получит root права
      # Может модифицировать файлы внутри контейнера, включая /etc
      runAsUser: 0
      runAsGroup: 0
      
      # Дополнительные нарушения
      # Нет readOnlyRootFilesystem - можно изменять файловую систему
      readOnlyRootFilesystem: false
      
      # Разрешена эскалация привилегий
      allowPrivilegeEscalation: true

