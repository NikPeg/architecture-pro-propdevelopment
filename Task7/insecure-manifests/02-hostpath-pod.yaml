apiVersion: v1
kind: Pod
metadata:
  name: pod-hostpath
  namespace: audit-zone
  labels:
    app: insecure-test
    violation: hostpath-mount
spec:
  containers:
  - name: alpine
    image: alpine:3.19
    command: ["sleep", "3600"]
    securityContext:
      runAsUser: 0  # root user
    volumeMounts:
    - name: host-root
      mountPath: /host
      # Монтирует корень хост-системы в /host
      # Позволяет читать/изменять файлы хоста
  volumes:
  - name: host-root
    # НАРУШЕНИЕ 2: hostPath volume
    # Прямой доступ к файловой системе хоста
    # Может читать secrets, SSH keys, /etc/passwd и т.д.
    # Может модифицировать системные файлы
    hostPath:
      path: /
      type: Directory

