apiVersion: v1
kind: Namespace
metadata:
  name: audit-zone
  labels:
    # Pod Security Standards (PSS) - встроенный механизм в Kubernetes 1.23+
    # Уровни: privileged (без ограничений), baseline (минимальные), restricted (строгие)
    
    # enforce - блокирует создание подов, нарушающих политику
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    
    # audit - логирует нарушения, но разрешает создание
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    
    # warn - показывает предупреждения при создании
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    
    # Метаданные для PropDevelopment
    app: propdevelopment
    environment: security-audit
    managed-by: security-team
---
# ServiceAccount для тестирования
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-test-sa
  namespace: audit-zone
---
# Минимальная Role для тестирования
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: audit-test-role
  namespace: audit-zone
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: audit-test-binding
  namespace: audit-zone
subjects:
- kind: ServiceAccount
  name: audit-test-sa
  namespace: audit-zone
roleRef:
  kind: Role
  name: audit-test-role
  apiGroup: rbac.authorization.k8s.io

